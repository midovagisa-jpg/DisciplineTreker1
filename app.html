/* ── page transition ── */
@keyframes pageIn{
  from{opacity:0;transform:translateX(28px) scale(.97);}
  to  {opacity:1;transform:translateX(0)     scale(1);}
}
@keyframes pageBack{
  from{opacity:0;transform:translateX(-28px) scale(.97);}
  to  {opacity:1;transform:translateX(0)     scale(1);}
}
.page-enter{animation:pageIn .32s cubic-bezier(.22,1,.36,1) both;}
.page-back {animation:pageBack .32s cubic-bezier(.22,1,.36,1) both;}

/* ── shimmer on gradient buttons ── */
@keyframes shimmer{
  0%  {background-position:200% center;}
  100%{background-position:-200% center;}
}
.btn-shine{
  position:relative;overflow:hidden;
  background-size:200% auto;
  animation:shimmer 3.5s linear infinite;
  transition:transform .15s, box-shadow .15s;
}
.btn-shine:active{transform:scale(.96);}
.btn-shine:hover{box-shadow:0 4px 28px rgba(255,107,53,.45);}

/* ── card glow on tap ── */
.card-glow{
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .25s;
}
.card-glow:active{
  transform:scale(.975);
  box-shadow:0 0 0 1.5px rgba(255,107,53,.35), 0 8px 30px rgba(255,107,53,.15);
}

/* ── nav icon bounce ── */
@keyframes navPop{
  0%  {transform:scale(1);}
  45% {transform:scale(1.32) translateY(-3px);}
  70% {transform:scale(.93);}
  100%{transform:scale(1);}
}
.nav-pop{animation:navPop .38s cubic-bezier(.34,1.56,.64,1);}

/* ── soft glow pulse on accent elements ── */
@keyframes glowPulse{
  0%,100%{box-shadow:0 0 0px 0px rgba(255,107,53,0);}
  50%    {box-shadow:0 0 18px 4px rgba(255,107,53,.25);}
}
.glow-pulse{animation:glowPulse 2.8s ease-in-out infinite;}

/* ── existing ── */
@keyframes slideDown{from{opacity:0;transform:translateX(-50%) translateY(-14px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes flame{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

/* ── fire ── */
@keyframes fireWiggle{
  0%  {transform:scaleX(1)   scaleY(1)   rotate(-1deg);}
  20% {transform:scaleX(.94) scaleY(1.05) rotate(1.5deg);}
  40% {transform:scaleX(1.04) scaleY(.97) rotate(-2deg);}
  60% {transform:scaleX(.97) scaleY(1.06) rotate(1deg);}
  80% {transform:scaleX(1.03) scaleY(.98) rotate(-1.5deg);}
  100%{transform:scaleX(1)   scaleY(1)   rotate(-1deg);}
}
@keyframes fireGlow{
  0%,100%{filter:drop-shadow(0 0 10px #FF6B35) drop-shadow(0 0 24px #FF3366) drop-shadow(0 0 6px #FFD700);}
  50%    {filter:drop-shadow(0 0 22px #FF9800) drop-shadow(0 0 44px #FF3366) drop-shadow(0 0 14px #FFD700);}
}
@keyframes fireGlowDim{
  0%,100%{filter:drop-shadow(0 0 4px #555) drop-shadow(0 0 8px #333);}
  50%    {filter:drop-shadow(0 0 8px #666) drop-shadow(0 0 14px #444);}
}
@keyframes countUp{
  from{transform:scale(.7);opacity:0;}
  60% {transform:scale(1.15);opacity:1;}
  to  {transform:scale(1);opacity:1;}
}
.fire-active{
  animation:fireWiggle 1.8s ease-in-out infinite, fireGlow 2.2s ease-in-out infinite;

}
.fire-dim{
  animation:fireWiggle 4s ease-in-out infinite, fireGlowDim 3s ease-in-out infinite;

}

const p2=n=>String(Math.floor(Math.abs(n))).padStart(2,'0');
const fmtCk=d=>`${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;
const fmtSW=ms=>`${p2(ms/60000)}:${p2((ms%60000)/1000)}.${p2((ms%1000)/10)}`;
const fmtDist=m=>m<1000?`${Math.round(m)} м`:`${(m/1000).toFixed(2)} км`;
const fmtPace=(m,s)=>{ // темп мин/км
  if(m<50||s<5)return "—";
  const pace=s/(m/1000);
  return `${p2(pace/60)}:${p2(pace%60)} /км`;
};
const sleepDurMin=(bed,wake)=>{
  const[bh,bm]=bed.split(":").map(Number),[wh,wm]=wake.split(":").map(Number);
  let diff=(wh*60+wm)-(bh*60+bm);
  if(diff<=0)diff+=1440;
  return diff;
};
const fmtSleepDur=min=>`${Math.floor(min/60)}ч ${min%60}м`;
const calcDist=(a,b)=>{
  const R=6371000,f1=a.lat*Math.PI/180,f2=b.lat*Math.PI/180,
        df=(b.lat-a.lat)*Math.PI/180,dl=(b.lng-a.lng)*Math.PI/180,
        x=Math.sin(df/2)**2+Math.cos(f1)*Math.cos(f2)*Math.sin(dl/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
};
// format seconds as Xд Xч Xм Xс
const fmtClean=s=>{
  const d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60),sec=s%60;
  if(d>0) return `${d}д ${p2(h)}ч ${p2(m)}м`;
  if(h>0) return `${p2(h)}ч ${p2(m)}м ${p2(sec)}с`;
  return `${p2(m)}м ${p2(sec)}с`;
};

function CounterCard({icon,name,color,val,dayTotal,setVal,addDay,bulks}){
  return(
    <div style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:20,padding:20,marginBottom:20}}>

          </div>
        </div>
        <button onClick={()=>setVal(0)} style={{background:"rgba(220,50,50,0.12)",border:"1px solid rgba(220,50,50,0.2)",borderRadius:12,padding:"8px 16px",fontSize:13,fontWeight:700,color:"#f87171"}}>Сброс</button>
      </div>
      <div style={{textAlign:"center",marginBottom:22}}>
        <div className="num" style={{fontSize:100,fontWeight:900,lineHeight:1,color,letterSpacing:-3}}>{val}</div>
        <div style={{fontSize:13,color:"rgba(255,255,255,0.3)",marginTop:8}}>текущий подход</div>
      </div>
      <div style={{display:"flex",gap:12,marginBottom:12}}>
        <button onClick={()=>setVal(v=>Math.max(0,v-1))} style={{width:60,height:60,borderRadius:18,border:"1px solid rgba(255,255,255,0.1)",background:"rgba(255,255,255,0.06)",color:"#fff",fontSize:28,fontWeight:700}}>−</button>
        <button onClick={()=>setVal(v=>v+1)} style={{flex:1,height:60,borderRadius:18,border:"none",background:`linear-gradient(135deg,${color},${color}bb)`,color:"#fff",fontSize:22,fontWeight:900}}>+1</button>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:14}}>
        {bulks.map(n=>(
          <button key={n} onClick={()=>setVal(v=>v+n)} style={{flex:1,padding:"10px 0",borderRadius:14,border:`1.5px solid ${color}44`,background:`${color}12`,color,fontSize:14,fontWeight:800}}>+{n}</button>
        ))}
      </div>
      <button onClick={()=>{if(val>0){addDay(val);setVal(0);}}} disabled={val===0}
        style={{width:"100%",padding:14,borderRadius:16,border:"none",fontSize:15,fontWeight:700,
          background:val>0?`linear-gradient(135deg,${color},${color}99)`:"rgba(255,255,255,0.06)",
          color:val>0?"#fff":"rgba(255,255,255,0.2)"}}>
        {val>0?`✅ Сохранить подход (${val})`:"Сохранить подход"}
      </button>
    </div>
  );
}

              {[15,30,45,60].map(m=>(
                <button key={m} onClick={()=>setSmTarget(m)}
                  style={{flex:1,padding:"9px 0",borderRadius:10,
                    border:`1.5px solid ${smTarget===m?"#FF6B35":"rgba(255,255,255,0.1)"}`,
                    background:smTarget===m?"rgba(255,107,53,0.15)":"transparent",
                    color:smTarget===m?"#FF6B35":"rgba(255,255,255,0.4)",fontSize:13,fontWeight:700}}>{m} мин</button>

            </div>
            {smTarget&&<div style={{marginTop:10,height:5,background:"rgba(255,255,255,0.07)",borderRadius:99,overflow:"hidden"}}>
              <div style={{height:"100%",width:`${Math.min((smSec/(smTarget*60))*100,100)}%`,background:"linear-gradient(90deg,#FF6B35,#FF3366)",borderRadius:99,transition:"width 1s"}}/>

        <span style={C.lbl}>Сегодня — {doneIds.length} / {habits.length}</span>

          <div style={{height:"100%",borderRadius:99,background:"linear-gradient(90deg,#FF6B35,#FF3366)",width:`${progress*100}%`,transition:"width .5s"}}/>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {habits.map(h=>{
            const done=doneIds.includes(h.id),isEd=editId===h.id;
            return(
              <div key={h.id} style={{display:"flex",alignItems:"center",gap:10,
                background:done?`${h.color}18`:"rgba(255,255,255,0.03)",
                border:`1.5px solid ${done?h.color+"55":"rgba(255,255,255,0.06)"}`,
                borderRadius:16,padding:"12px 14px"}}>
                <div style={{display:"flex",alignItems:"center",gap:12,flex:1,minWidth:0,cursor:isEd?"default":"pointer"}}
                     onClick={()=>{if(!isEd)toggleH(h.id);}}>
                  <span style={{fontSize:24,flexShrink:0}}>{h.icon}</span>
                  {isEd?(
                    <input autoFocus value={editName} onChange={e=>setEditName(e.target.value)}
                      onBlur={()=>saveEd(h.id)}
                      onKeyDown={e=>{if(e.key==="Enter"){e.preventDefault();saveEd(h.id);}if(e.key==="Escape")setEditId(null);}}
                      onClick={e=>e.stopPropagation()} maxLength={32}
                      style={{flex:1,background:"rgba(0,0,0,0.35)",border:`2px solid ${h.color}`,borderRadius:10,padding:"6px 12px",color:"#fff",fontSize:15,fontWeight:600,outline:"none",minWidth:0}}/>
                  ):(
                    <span style={{flex:1,fontSize:15,fontWeight:600,color:done?"#fff":"rgba(255,255,255,0.6)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{h.name}</span>
                  )}
                </div>
                {!isEd&&<div onClick={()=>toggleH(h.id)} style={{width:28,height:28,borderRadius:8,flexShrink:0,background:done?h.color:"transparent",border:`2px solid ${done?h.color:"rgba(255,255,255,0.15)"}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,cursor:"pointer",fontWeight:800}}>{done?"✓":""}</div>}
                {!isEd?(
                  <div style={{display:"flex",gap:4,flexShrink:0}}>
                    <button onClick={e=>{e.stopPropagation();startEd(h);}} style={{background:"rgba(255,255,255,0.06)",border:"none",borderRadius:8,width:32,height:32,fontSize:15,color:"rgba(255,255,255,0.5)",display:"flex",alignItems:"center",justifyContent:"center"}}>✏️</button>
                    <button onClick={e=>{e.stopPropagation();delH(h.id);}} style={{background:"rgba(255,60,60,0.08)",border:"none",borderRadius:8,width:32,height:32,fontSize:15,color:"rgba(255,100,100,0.5)",display:"flex",alignItems:"center",justifyContent:"center"}}>🗑</button>
                  </div>
                ):(
                  <button onClick={()=>saveEd(h.id)} style={{background:`${h.color}22`,border:`1.5px solid ${h.color}`,borderRadius:8,padding:"5px 14px",fontSize:13,fontWeight:700,color:"#fff",flexShrink:0}}>OK</button>
                )}
              </div>
            );
          })}
          <div onClick={()=>setHModal(true)} style={{display:"flex",alignItems:"center",gap:14,background:"rgba(255,255,255,0.02)",border:"1.5px dashed rgba(255,255,255,0.1)",borderRadius:16,padding:"14px 16px",cursor:"pointer"}}>
            <span style={{fontSize:24}}>➕</span>
            <span style={{fontSize:15,fontWeight:600,color:"rgba(255,255,255,0.3)"}}>Добавить привычку</span>
          </div>
        </div>
        {allDone&&<div style={{marginTop:16,background:"rgba(76,175,80,.1)",border:"1.5px solid rgba(76,175,80,.3)",borderRadius:16,padding:"14px 18px",fontSize:15,fontWeight:700,color:"#66BB6A"}}>🎉 Все привычки выполнены!</div>}
      </>}

      {/* ══ STREAK / FIRE ══ */}
      {tab==="streak"&&(()=>{
        const sz=streak===0?80:Math.min(80+streak*8,220);
        const active=streak>0;
        return<>
          <div style={{textAlign:"center",paddingTop:30,paddingBottom:10}}>
            <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",fontWeight:700,letterSpacing:2,textTransform:"uppercase",marginBottom:30}}>
              {active?"Твой огонь горит":"Начни свой путь"}
            </div>

            {/* fire emoji animated */}
            <div style={{display:"flex",justifyContent:"center",alignItems:"flex-end",height:240,marginBottom:16,position:"relative"}}>
              {active&&[...Array(6)].map((_,i)=>(
                <div key={i} style={{
                  position:"absolute",bottom:0,left:"50%",transform:`translateX(-50%) translateX(${(i-2.5)*18}px)`,
                  width:Math.max(6,sz*.08),height:Math.max(10,sz*.22+i*4),
                  borderRadius:"50% 50% 30% 30%",
                  background:`radial-gradient(ellipse at 50% 80%,${["#FFD700","#FF9800","#FF6B35","#FF3366","#FF6B35","#FFD700"][i]},transparent)`,

                  animation:`fireWiggle ${1.4+i*.3}s ${i*.18}s ease-in-out infinite`,
                  transformOrigin:"center bottom",
                }}/>
              ))}
              <span className={active?"fire-active":"fire-dim"}
                style={{fontSize:sz,lineHeight:1,display:"block",userSelect:"none",position:"relative",zIndex:2}}>
                🔥
              </span>
            </div>

            {/* streak counter */}
            <div key={streak} className="streak-count">
              <div className="num" style={{
                fontSize:streak>=100?72:streak>=10?88:96,
                fontWeight:900,lineHeight:1,letterSpacing:-4,
                background:active?"linear-gradient(180deg,#FFD700 0%,#FF9800 40%,#FF3366 100%)":"rgba(255,255,255,0.15)",
                WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",
                filter:active?"drop-shadow(0 0 18px #FF9800)":"none",
              }}>{streak}</div>
              <div style={{fontSize:16,fontWeight:700,color:active?"rgba(255,200,100,0.8)":"rgba(255,255,255,0.25)",marginTop:8,letterSpacing:1}}>
                {(()=>{const n=streak;return n===0?"дней":n%100>=11&&n%100<=14?"дней":n%10===1?"день":n%10>=2&&n%10<=4?"дня":"дней";})()}
              </div>
            </div>

            <div style={{marginTop:24,fontSize:13,color:active?"rgba(255,200,100,0.55)":"rgba(255,255,255,0.2)",lineHeight:1.7,padding:"0 30px"}}>
              {streak===0&&"Выполни все привычки сегодня\nи огонь разгорится"}
              {streak>=1&&streak<7&&"🌱 Хорошее начало! Не останавливайся"}
              {streak>=7&&streak<14&&"🔥 Неделя позади — ты уже сильнее"}
              {streak>=14&&streak<30&&"⚡ Две недели! Это уже серьёзно"}
              {streak>=30&&streak<60&&"💎 Месяц без перерыва. Легенда."}
              {streak>=60&&streak<100&&"🏆 Два месяца — ты непоколебим"}
              {streak>=100&&"👑 100+ дней. Ты — дисциплина."}

            {streak>0&&(
              <div style={{marginTop:28,display:"flex",gap:12,justifyContent:"center",flexWrap:"wrap",padding:"0 20px"}}>

                  <div key={t} style={{background:"rgba(255,107,53,0.08)",border:"1px solid rgba(255,107,53,0.2)",borderRadius:12,padding:"8px 14px",fontSize:12,color:"rgba(255,180,80,0.7)"}}>

                  </div>
                ))}
              </div>
            )}
          </div>
        </>;
      })()}

      {/* ══ COUNTERS ══ */}
      {tab==="counters"&&<>
        <span style={{...C.lbl,marginTop:20}}>Счётчик упражнений</span>
        <CounterCard icon="💪" name="Отжимания"   color="#FF6B35" val={pu} dayTotal={puD} setVal={setPu} addDay={v=>{setPuD(d=>d+v);if(v>puB)setPuB(v);}} bulks={[5,10,20,50]}/>
        <CounterCard icon="🙌" name="Подтягивания" color="#9C27B0" val={pl} dayTotal={plD} setVal={setPl} addDay={v=>{setPlD(d=>d+v);if(v>plB)setPlB(v);}} bulks={[2,5,10,15]}/>
        <CounterCard icon="🦵" name="Приседания"  color="#4CAF50" val={sq} dayTotal={sqD} setVal={setSq} addDay={v=>{setSqD(d=>d+v);if(v>sqB)setSqB(v);}} bulks={[5,10,20,50]}/>
        <CounterCard icon="🪢" name="Скакалка"    color="#00BCD4" val={ju} dayTotal={juD} setVal={setJu} addDay={v=>{setJuD(d=>d+v);if(v>juB)setJuB(v);}} bulks={[10,25,50,100]}/>
        <CounterCard icon="🚶" name="Выпады"      color="#FF9800" val={lu} dayTotal={luD} setVal={setLu} addDay={v=>{setLuD(d=>d+v);}} bulks={[5,10,20,30]}/>

        {customEx.map(ex=>(
          <div key={ex.id} style={{position:"relative"}}>
            <CounterCard icon={ex.icon} name={ex.name} color={ex.color}

              addDay={v=>addExDay(ex.id,v)}

            <button onClick={()=>delEx(ex.id)}
              style={{position:"absolute",top:16,right:16,background:"rgba(220,50,50,0.13)",border:"1px solid rgba(220,50,50,0.25)",borderRadius:10,padding:"6px 12px",fontSize:12,fontWeight:700,color:"#f87171"}}>
              Удалить
            </button>
          </div>
        ))}

        <button className="btn-shine" onClick={()=>{setExName("");setExIcon("⚡");setExColor("#FF6B35");setExBulks("5,10,20");setExModal(true);}}
          style={{width:"100%",padding:14,borderRadius:16,border:"none",background:"linear-gradient(135deg,#FF6B35,#FF3366)",color:"#fff",fontWeight:700,fontSize:15,marginBottom:20}}>
          + Добавить упражнение
        </button>

        <span style={{...C.lbl,marginTop:4}}>Итого сегодня</span>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,paddingBottom:8}}>
          {[["💪","Отжимания",puD,"#FF6B35"],["🙌","Подтягивания",plD,"#9C27B0"],["🦵","Приседания",sqD,"#4CAF50"],["🪢","Скакалка",juD,"#00BCD4"],["🚶","Выпады",luD,"#FF9800"],
            ...customEx.map(e=>[e.icon,e.name,customDay[e.id]||0,e.color])
          ].map(([ic,nm,v,col])=>(
            <div key={nm} style={{...C.card,padding:16,textAlign:"center"}}>
              <div style={{fontSize:26,marginBottom:6}}>{ic}</div>
              <div className="num" style={{fontSize:28,fontWeight:900,color:v>0?col:"rgba(255,255,255,0.2)"}}>{v}</div>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.35)",marginTop:4}}>{nm}</div>
            </div>
          ))}
        </div>
      </>}

      {/* ══ BAD HABITS ══ */}
      {tab==="bad"&&<>
        <span style={{...C.lbl,marginTop:20}}>Таймер плохих привычек</span>
        <div style={{...C.card,marginBottom:16,background:"rgba(255,51,102,0.06)",border:"1px solid rgba(255,51,102,0.15)"}}>
          <div style={{fontSize:13,color:"rgba(255,255,255,0.5)",lineHeight:1.7}}>
            Добавь привычку от которой хочешь избавиться.<br/>
            Таймер считает сколько времени ты держишься. Сорвался — нажми «Сброс».
          </div>
        </div>
        {badHabits.length===0&&(
          <div style={{textAlign:"center",padding:"40px 20px",color:"rgba(255,255,255,0.25)",fontSize:14,lineHeight:1.8}}>
            🚫<br/>Нет плохих привычек.<br/>Добавь первую — и начни борьбу!
          </div>
        )}
        {badHabits.map(b=>{
          const days=Math.floor((b.elapsed||0)/86400);
          const pct=Math.min((days/30)*100,100);
          return(
            <div key={b.id} style={{...C.card,marginBottom:14,borderColor:`${b.color}33`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
                <div style={{display:"flex",alignItems:"center",gap:12}}>
                  <div style={{width:48,height:48,borderRadius:14,background:`${b.color}22`,border:`2px solid ${b.color}44`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24}}>{b.icon}</div>
                  <div>
                    <div style={{fontSize:16,fontWeight:800}}>{b.name}</div>
                    <div style={{fontSize:11,color:"rgba(255,255,255,0.35)",marginTop:2}}>Сбросов: {b.lapses||0}</div>
                  </div>
                </div>
                <button onClick={()=>delBH(b.id)} style={{background:"rgba(255,60,60,0.08)",border:"none",borderRadius:8,width:30,height:30,fontSize:14,color:"rgba(255,100,100,0.5)",display:"flex",alignItems:"center",justifyContent:"center"}}>🗑</button>
              </div>
              <div style={{textAlign:"center",padding:"10px 0 14px"}}>
                <div className="num" style={{fontSize:40,fontWeight:900,color:b.color}}>{fmtClean(b.elapsed||0)}</div>
                <div style={{fontSize:12,color:"rgba(255,255,255,0.4)",marginTop:4}}>без "{b.name}"</div>
              </div>
              <div style={{height:6,background:"rgba(255,255,255,0.07)",borderRadius:99,overflow:"hidden",marginBottom:12}}>
                <div style={{height:"100%",width:`${pct}%`,background:`linear-gradient(90deg,${b.color},${b.color}88)`,borderRadius:99,transition:"width 1s"}}/>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"rgba(255,255,255,0.3)",marginBottom:12}}>
                <span>Сейчас: {days} дн.</span><span>Цель: 30 дн.</span>
              </div>
              <button onClick={()=>resetBH(b.id)}
                style={{width:"100%",padding:12,borderRadius:14,border:`1.5px solid ${b.color}44`,background:`${b.color}12`,color:b.color,fontWeight:700,fontSize:14}}>
                😔 Сорвался — сброс
              </button>
            </div>
          );
        })}
        <button onClick={()=>setBhModal(true)}
          style={{width:"100%",padding:14,borderRadius:16,border:"1.5px dashed rgba(255,51,102,0.3)",background:"rgba(255,51,102,0.05)",color:"#FF3366",fontWeight:700,fontSize:15,marginTop:4}}>

        </button>
      </>}

      {/* ══ NOTES ══ */}
      {tab==="notes"&&<>
        <span style={{...C.lbl,marginTop:20}}>Мои записи — {notes.length}</span>
        <button className="btn-shine" onClick={()=>{setNoteText("");setNoteMood("😊");setEditNoteId(null);setNoteModal(true);}}
          style={{width:"100%",padding:14,borderRadius:16,border:"none",background:"linear-gradient(135deg,#FF6B35,#FF3366)",color:"#fff",fontWeight:700,fontSize:15,marginBottom:16}}>
          + Новая запись
        </button>
        {notes.length===0&&(
          <div style={{textAlign:"center",padding:"40px 20px",color:"rgba(255,255,255,0.25)",fontSize:14,lineHeight:1.8}}>
            📓<br/>Нет записей.<br/>Веди дневник — фиксируй прогресс и мысли!
          </div>
        )}
        {notes.map(n=>(
          <div key={n.id} style={{...C.card,marginBottom:12}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:22}}>{n.mood}</span>
                <div style={{fontSize:11,color:"rgba(255,255,255,0.35)"}}>{n.date} · {n.time}</div>
              </div>
              <div style={{display:"flex",gap:6}}>
                <button onClick={()=>editNote(n)} style={{background:"rgba(255,255,255,0.06)",border:"none",borderRadius:8,width:30,height:30,fontSize:14,color:"rgba(255,255,255,0.5)",display:"flex",alignItems:"center",justifyContent:"center"}}>✏️</button>
                <button onClick={()=>delNote(n.id)} style={{background:"rgba(255,60,60,0.08)",border:"none",borderRadius:8,width:30,height:30,fontSize:14,color:"rgba(255,100,100,0.5)",display:"flex",alignItems:"center",justifyContent:"center"}}>🗑</button>
              </div>
            </div>
            <div style={{fontSize:14,color:"rgba(255,255,255,0.85)",lineHeight:1.65,whiteSpace:"pre-wrap"}}>{n.text}</div>
          </div>
        ))}
      </>}

      {/* ══ MORE ══ */}
      {tab==="more"&&<>
        <span style={{...C.lbl,marginTop:20}}>Ещё</span>
        {[
          {icon:"🗺",label:"Карта и пробежка",sub:"GPS-трек маршрута",t:"gps"},
          {icon:"⏱",label:"Секундомер",sub:"Засекай время",t:"stopwatch"},
          {icon:"📅",label:"Календарь",sub:"Трекер дней",t:"calendar"},
          {icon:"😴",label:"Сон",sub:sleeps.length?`Средний сон: ${fmtSleepDur(avgSleep)}`:"Дневник, советы, факты",t:"sleep"},
          {icon:"🏆",label:"Достижения",sub:`${ACHS.filter(achOk).length} / ${ACHS.length} разблокировано`,t:"achievements"},
          {icon:"💫",label:"Поддержать проект 💫",sub:`Цель: ${SUPPORT_GOAL.toLocaleString("ru-RU")} ₽`,t:"support"},
        ].map(item=>(
          <div key={item.t} className="card-glow" onClick={()=>go(item.t)}
            style={{display:"flex",alignItems:"center",justifyContent:"space-between",...C.card,marginBottom:10,cursor:"pointer"}}>
            <div style={{display:"flex",alignItems:"center",gap:14}}>
              <span style={{fontSize:28}}>{item.icon}</span>
              <div><div style={{fontSize:15,fontWeight:700}}>{item.label}</div>
                   <div style={{fontSize:12,color:"rgba(255,255,255,0.4)",marginTop:2}}>{item.sub}</div></div>
            </div>
            <span style={{fontSize:20,color:"rgba(255,255,255,0.25)"}}>›</span>
          </div>
        ))}
      </>}

      {/* ══ GPS ══ */}
      {tab==="gps"&&<>
        <span style={{...C.lbl,marginTop:20}}>Пробежка · GPS</span>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
          <div style={{...C.card,padding:16,textAlign:"center"}}>
            <div style={{fontSize:11,color:"rgba(255,255,255,0.35)",fontWeight:700,letterSpacing:.5,textTransform:"uppercase"}}>Дистанция</div>
            <div className="num" style={{fontSize:30,fontWeight:900,color:"#4CAF50",marginTop:8}}>{fmtDist(dist)}</div>
          </div>
          <div style={{...C.card,padding:16,textAlign:"center"}}>
            <div style={{fontSize:11,color:"rgba(255,255,255,0.35)",fontWeight:700,letterSpacing:.5,textTransform:"uppercase"}}>Время</div>
            <div className="num" style={{fontSize:30,fontWeight:900,color:"#2196F3",marginTop:8}}>{fmtSMT(runElapsed)}</div>
          </div>
          <div style={{...C.card,padding:16,textAlign:"center"}}>
            <div style={{fontSize:11,color:"rgba(255,255,255,0.35)",fontWeight:700,letterSpacing:.5,textTransform:"uppercase"}}>Темп</div>
            <div className="num" style={{fontSize:30,fontWeight:900,color:"#FF9800",marginTop:8}}>{fmtPace(dist,runElapsed)}</div>
          </div>
          <div style={{...C.card,padding:16,textAlign:"center"}}>
            <div style={{fontSize:11,color:"rgba(255,255,255,0.35)",fontWeight:700,letterSpacing:.5,textTransform:"uppercase"}}>Точки GPS</div>
            <div className="num" style={{fontSize:30,fontWeight:900,color:"#9C27B0",marginTop:8}}>{route.length}</div>
          </div>
        </div>
        <div style={{display:"flex",gap:10,marginBottom:14}}>
          <button className="btn-shine" onClick={tracking?stopGPS:startGPS}
            style={{flex:1,padding:14,borderRadius:16,border:"none",
              background:tracking?"linear-gradient(135deg,#FF3366,#FF6B35)":"linear-gradient(135deg,#4CAF50,#00BCD4)",
              color:"#fff",fontWeight:700,fontSize:15}}>
            {tracking?"⏹ Остановить":"▶ Начать пробежку"}
          </button>
          <button onClick={()=>{setRoute([]);setDist(0);setRunElapsed(0);if(polyline.current)polyline.current.setLatLngs([]);}}
            style={{padding:"14px 18px",borderRadius:16,border:"1px solid rgba(255,255,255,0.1)",background:"rgba(255,255,255,0.05)",color:"rgba(255,255,255,0.5)",fontWeight:700,fontSize:16}}>🗑</button>
        </div>
        {!tracking&&dist>0&&(
          <button className="btn-shine" onClick={saveRun} style={{width:"100%",padding:14,borderRadius:16,border:"none",background:"linear-gradient(135deg,#4CAF50,#00BCD4)",color:"#fff",fontWeight:700,fontSize:15,marginBottom:14}}>
            💾 Сохранить пробежку
          </button>

              <div style={{fontSize:11,fontWeight:700,letterSpacing:1.2,color:"rgba(255,255,255,0.35)",textTransform:"uppercase",marginBottom:10}}>Иконка</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:18}}>
                {EMOJIS.map(e=><button key={e} onClick={()=>setNIcon(e)} style={{width:42,height:42,borderRadius:11,border:`2px solid ${nIcon===e?"#FF6B35":"transparent"}`,background:nIcon===e?"rgba(255,107,53,.18)":"rgba(255,255,255,0.05)",fontSize:22,display:"flex",alignItems:"center",justifyContent:"center"}}>{e}</button>)}
              </div>
              <div style={{fontSize:11,fontWeight:700,letterSpacing:1.2,color:"rgba(255,255,255,0.35)",textTransform:"uppercase",marginBottom:10}}>Цвет</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:20}}>
                {COLORS.map(col=><button key={col} onClick={()=>setNColor(col)} style={{width:38,height:38,borderRadius:10,border:`3px solid ${nColor===col?"#fff":"transparent"}`,background:col,boxSizing:"border-box"}}/>)}
              </div>
            </div>
            <div style={{padding:"14px 20px 38px",borderTop:"1px solid rgba(255,255,255,0.06)",flexShrink:0}}>
              <div style={{display:"flex",alignItems:"center",gap:14,background:`${nColor}18`,border:`1.5px solid ${nColor}44`,borderRadius:14,padding:"13px 16px",marginBottom:14}}>
                <span style={{fontSize:24}}>{nIcon}</span>
                <span style={{fontSize:15,fontWeight:600,color:nName?"#fff":"rgba(255,255,255,0.35)"}}>{nName||"Название"}</span>
              </div>
              <button onClick={addH} disabled={!nName.trim()} style={{width:"100%",padding:15,borderRadius:16,border:"none",background:nName.trim()?"linear-gradient(135deg,#FF6B35,#FF3366)":"rgba(255,255,255,0.07)",color:nName.trim()?"#fff":"rgba(255,255,255,0.2)",fontWeight:700,fontSize:15}}>Добавить</button>
            </div>
          </div>
        </div>
      )}

      {/* ── Add Bad Habit Modal ── */}
      {bhModal&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.82)",backdropFilter:"blur(10px)",zIndex:200,display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={()=>setBhModal(false)}>
          <div style={{background:"#141418",border:"1px solid rgba(255,51,102,0.2)",borderRadius:"26px 26px 0 0",width:"100%",maxWidth:430,maxHeight:"90dvh",display:"flex",flexDirection:"column"}} onClick={e=>e.stopPropagation()}>
            <div style={{padding:"18px 20px 0",flexShrink:0}}>
              <div style={{width:40,height:4,background:"rgba(255,255,255,0.15)",borderRadius:99,margin:"0 auto 16px"}}/>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
                <div style={{fontSize:18,fontWeight:800}}>Плохая привычка</div>
                <button onClick={()=>setBhModal(false)} style={{background:"rgba(255,255,255,0.08)",border:"none",borderRadius:10,width:34,height:34,fontSize:17,color:"rgba(255,255,255,0.6)",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
              </div>
              <input style={{width:"100%",background:"rgba(255,255,255,0.07)",border:"1.5px solid rgba(255,51,102,0.3)",borderRadius:14,padding:"14px 16px",color:"#fff",fontSize:15,outline:"none",boxSizing:"border-box",marginBottom:16}} placeholder="Например: Курение, соцсети..." value={bName} onChange={e=>setBName(e.target.value)} maxLength={32}/>
            </div>
            <div style={{overflowY:"auto",padding:"0 20px",flex:1}}>
              <div style={{fontSize:11,fontWeight:700,letterSpacing:1.2,color:"rgba(255,255,255,0.35)",textTransform:"uppercase",marginBottom:10}}>Иконка</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:18}}>
                {BAD_EMOJIS.map(e=><button key={e} onClick={()=>setBIcon(e)} style={{width:42,height:42,borderRadius:11,border:`2px solid ${bIcon===e?"#FF3366":"transparent"}`,background:bIcon===e?"rgba(255,51,102,.18)":"rgba(255,255,255,0.05)",fontSize:22,display:"flex",alignItems:"center",justifyContent:"center"}}>{e}</button>)}
              </div>
              <div style={{fontSize:11,fontWeight:700,letterSpacing:1.2,color:"rgba(255,255,255,0.35)",textTransform:"uppercase",marginBottom:10}}>Цвет</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:20}}>
                {BAD_COLORS.map(col=><button key={col} onClick={()=>setBColor(col)} style={{width:38,height:38,borderRadius:10,border:`3px solid ${bColor===col?"#fff":"transparent"}`,background:col,boxSizing:"border-box"}}/>)}
              </div>
            </div>
            <div style={{padding:"14px 20px 38px",borderTop:"1px solid rgba(255,255,255,0.06)",flexShrink:0}}>
              <button onClick={addBadHabit} disabled={!bName.trim()} style={{width:"100%",padding:15,borderRadius:16,border:"none",background:bName.trim()?"linear-gradient(135deg,#FF3366,#FF6B35)":"rgba(255,255,255,0.07)",color:bName.trim()?"#fff":"rgba(255,255,255,0.2)",fontWeight:700,fontSize:15}}>Начать отсчёт</button>
            </div>
          </div>
        </div>
      )}

      {/* ── Note Modal ── */}
      {noteModal&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.82)",backdropFilter:"blur(10px)",zIndex:200,display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={()=>setNoteModal(false)}>
          <div style={{background:"#141418",border:"1px solid rgba(255,255,255,0.1)",borderRadius:"26px 26px 0 0",width:"100%",maxWidth:430,display:"flex",flexDirection:"column"}} onClick={e=>e.stopPropagation()}>
            <div style={{padding:"18px 20px 16px"}}>
              <div style={{width:40,height:4,background:"rgba(255,255,255,0.15)",borderRadius:99,margin:"0 auto 16px"}}/>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
                <div style={{fontSize:18,fontWeight:800}}>{editNoteId?"Редактировать":"Новая запись"}</div>
                <button onClick={()=>setNoteModal(false)} style={{background:"rgba(255,255,255,0.08)",border:"none",borderRadius:10,width:34,height:34,fontSize:17,color:"rgba(255,255,255,0.6)",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
              </div>
              <div style={{fontSize:12,color:"rgba(255,255,255,0.35)",marginBottom:8,fontWeight:600}}>НАСТРОЕНИЕ</div>
              <div style={{display:"flex",gap:8,marginBottom:16}}>
                {MOODS.map(m=><button key={m} onClick={()=>setNoteMood(m)} style={{width:40,height:40,borderRadius:12,border:`2px solid ${noteMood===m?"#FF6B35":"transparent"}`,background:noteMood===m?"rgba(255,107,53,.18)":"rgba(255,255,255,0.05)",fontSize:22,display:"flex",alignItems:"center",justifyContent:"center"}}>{m}</button>)}
              </div>
              <textarea
                autoFocus
                value={noteText} onChange={e=>setNoteText(e.target.value)}
                placeholder="Что у тебя сегодня? Мысли, прогресс, планы..."
                style={{width:"100%",background:"rgba(255,255,255,0.06)",border:"1.5px solid rgba(255,255,255,0.12)",borderRadius:14,padding:"14px 16px",color:"#fff",fontSize:15,outline:"none",resize:"none",minHeight:120,lineHeight:1.6,boxSizing:"border-box",marginBottom:14}}
                rows={4}
              />
              <button onClick={saveNote} disabled={!noteText.trim()} style={{width:"100%",padding:14,borderRadius:16,border:"none",background:noteText.trim()?"linear-gradient(135deg,#FF6B35,#FF3366)":"rgba(255,255,255,0.07)",color:noteText.trim()?"#fff":"rgba(255,255,255,0.2)",fontWeight:700,fontSize:15,marginBottom:16}}>
                {editNoteId?"💾 Сохранить":"📝 Добавить запись"}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ── Sleep Modal ── */}
      {sleepModal&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.82)",backdropFilter:"blur(10px)",zIndex:200,display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={()=>setSleepModal(false)}>
          <div style={{background:"#141418",border:"1px solid rgba(33,150,243,0.2)",borderRadius:"26px 26px 0 0",width:"100%",maxWidth:430,maxHeight:"92dvh",display:"flex",flexDirection:"column"}} onClick={e=>e.stopPropagation()}>
            <div style={{padding:"18px 20px 0",flexShrink:0}}>
              <div style={{width:40,height:4,background:"rgba(255,255,255,0.15)",borderRadius:99,margin:"0 auto 16px"}}/>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
                <div style={{fontSize:18,fontWeight:800}}>{editSleepId?"Редактировать сон":"Записать сон"}</div>
                <button onClick={()=>setSleepModal(false)} style={{background:"rgba(255,255,255,0.08)",border:"none",borderRadius:10,width:34,height:34,fontSize:17,color:"rgba(255,255,255,0.6)",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
              </div>
            </div>
            <div style={{overflowY:"auto",padding:"0 20px",flex:1}}>
              <div style={{display:"flex",gap:12,marginBottom:18}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:12,color:"rgba(255,255,255,0.35)",marginBottom:8,fontWeight:600}}>ЛЁГ СПАТЬ</div>
                  <input type="time" value={bedTime} onChange={e=>setBedTime(e.target.value)}
                    style={{width:"100%",background:"rgba(255,255,255,0.07)",border:"1.5px solid rgba(255,255,255,0.15)",borderRadius:14,padding:"12px 14px",color:"#fff",fontSize:16,outline:"none",boxSizing:"border-box"}}/>
                </div>
                <div style={{flex:1}}>
                  <div style={{fontSize:12,color:"rgba(255,255,255,0.35)",marginBottom:8,fontWeight:600}}>ПРОСНУЛСЯ</div>
                  <input type="time" value={wakeTime} onChange={e=>setWakeTime(e.target.value)}
                    style={{width:"100%",background:"rgba(255,255,255,0.07)",border:"1.5px solid rgba(255,255,255,0.15)",borderRadius:14,padding:"12px 14px",color:"#fff",fontSize:16,outline:"none",boxSizing:"border-box"}}/>
                </div>
              </div>
              <div style={{textAlign:"center",fontSize:13,color:"rgba(255,255,255,0.45)",marginBottom:18}}>
                Продолжительность: <b style={{color:"#64B5F6"}}>{fmtSleepDur(sleepDurMin(bedTime,wakeTime))}</b>
              </div>
              <div style={{fontSize:12,color:"rgba(255,255,255,0.35)",marginBottom:8,fontWeight:600}}>КАК СПАЛОСЬ</div>
              <div style={{display:"flex",gap:8,marginBottom:18}}>
                {SLEEP_MOODS.map(m=><button key={m} onClick={()=>setSleepMood(m)} style={{width:40,height:40,borderRadius:12,border:`2px solid ${sleepMood===m?"#2196F3":"transparent"}`,background:sleepMood===m?"rgba(33,150,243,.18)":"rgba(255,255,255,0.05)",fontSize:22,display:"flex",alignItems:"center",justifyContent:"center"}}>{m}</button>)}
              </div>
              <textarea
                value={sleepNote} onChange={e=>setSleepNote(e.target.value)}
                placeholder="Заметка (необязательно): снилось что-то, просыпался ночью..."
                style={{width:"100%",background:"rgba(255,255,255,0.06)",border:"1.5px solid rgba(255,255,255,0.12)",borderRadius:14,padding:"14px 16px",color:"#fff",fontSize:14,outline:"none",resize:"none",minHeight:80,lineHeight:1.5,boxSizing:"border-box",marginBottom:14}}
                rows={3}
              />
            </div>
            <div style={{padding:"14px 20px 38px",borderTop:"1px solid rgba(255,255,255,0.06)",flexShrink:0}}>
              <button onClick={saveSleep} style={{width:"100%",padding:15,borderRadius:16,border:"none",background:"linear-gradient(135deg,#2196F3,#9C27B0)",color:"#fff",fontWeight:700,fontSize:15}}>
                {editSleepId?"💾 Сохранить":"😴 Сохранить сон"}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Nav */}
      <div style={C.nav}>
        {NAV.map(n=>(
          <div key={n.id} style={C.ni(tab===n.id)} onClick={()=>go(n.id)}>
            <span style={{fontSize:22}} className={tab===n.id?"nav-pop":""}>{n.icon}</span>
            <span style={C.nl(tab===n.id)}>{n.l}</span>
          </div>
        ))}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
